name: Deploy Elyra site to GitHub Pages

# Static site: the landing-page prototype (basecodebase/web) at the root
# plus the interactive POC under /poc/. Pushes that only touch the backend
# shouldn't redeploy the client.
on:
  push:
    branches: [main]
    paths:
      - "basecodebase/**"
      - "POC/POC version/Final POC/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage landing page
        run: cp -r basecodebase/web/. _site/

      - name: Stage interactive POC
        run: |
          mkdir -p _site/poc
          cp "POC/POC version/Final POC/"* _site/poc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
