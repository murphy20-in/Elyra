# ── Celery Worker Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: elyra
  labels:
    app: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/elyra/backend:latest
          command:
            - celery
            - -A
            - workers.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --queues=default,embedding,moderation,safety
          envFrom:
            - configMapRef:
                name: elyra-config
            - secretRef:
                name: elyra-secrets
          resources:
            requests:
              cpu:    "200m"
              memory: "384Mi"
            limits:
              cpu:    "800m"
              memory: "768Mi"
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - workers.celery_app
                - inspect
                - ping
                - -d
                - "celery@$HOSTNAME"
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
---
# ── Celery Beat Scheduler ─────────────────────────────────────────────────────
# MUST be a single replica to avoid duplicate scheduled tasks
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: elyra
  labels:
    app: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate           # Never run two beat instances simultaneously
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ghcr.io/elyra/backend:latest
          command:
            - celery
            - -A
            - workers.celery_app
            - beat
            - --loglevel=info
            - --scheduler
            - celery.beat:PersistentScheduler
          envFrom:
            - configMapRef:
                name: elyra-config
            - secretRef:
                name: elyra-secrets
          resources:
            requests:
              cpu:    "50m"
              memory: "128Mi"
            limits:
              cpu:    "200m"
              memory: "256Mi"