# !! TEMPLATE ONLY — DO NOT COMMIT REAL VALUES !!
# In production, use Sealed Secrets or External Secrets Operator.
# Replace all PLACEHOLDER values before applying.
apiVersion: v1
kind: Secret
metadata:
  name: elyra-secrets
  namespace: elyra
  annotations:
    # Reminder that this file must be sealed before committing
    elyra.app/secret-management: "sealed-secrets"
type: Opaque
stringData:
  # ── Databases ───────────────────────────────────────────────────────────────
  DATABASE_URL:           "postgresql+asyncpg://elyra_user:PLACEHOLDER@postgres-service:5432/elyra_db"
  MONGODB_URL:            "mongodb://elyra_user:PLACEHOLDER@mongodb-service:27017"
  REDIS_URL:              "redis://:PLACEHOLDER@redis-service:6379/0"
  POSTGRES_PASSWORD:      "PLACEHOLDER"
  MONGO_INITDB_ROOT_PASSWORD: "PLACEHOLDER"
  REDIS_PASSWORD:         "PLACEHOLDER"

  # ── Auth ────────────────────────────────────────────────────────────────────
  JWT_SECRET_KEY:         "PLACEHOLDER-minimum-32-chars"
  AES_ENCRYPTION_KEY:     "PLACEHOLDER-32-byte-hex-key"

  # ── Storage ─────────────────────────────────────────────────────────────────
  AWS_ACCESS_KEY_ID:      "PLACEHOLDER"
  AWS_SECRET_ACCESS_KEY:  "PLACEHOLDER"
  S3_ENDPOINT_URL:        ""

  # ── External Services ────────────────────────────────────────────────────────
  TWILIO_ACCOUNT_SID:     "PLACEHOLDER"
  TWILIO_AUTH_TOKEN:      "PLACEHOLDER"
  TWILIO_FROM_NUMBER:     "PLACEHOLDER"
  SENDGRID_API_KEY:       "PLACEHOLDER"
  FIREBASE_SERVICE_ACCOUNT_JSON: "PLACEHOLDER"
  RAZORPAY_KEY_ID:        "PLACEHOLDER"
  RAZORPAY_KEY_SECRET:    "PLACEHOLDER"

  # ── Observability ────────────────────────────────────────────────────────────
  SENTRY_DSN:             "PLACEHOLDER"