# ─────────────────────────────────────────────────────────────────────────────
# EMBEDDING SERVICE (port 9001)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embedding-service
  namespace: elyra
  labels:
    app: embedding-service
    tier: ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: embedding-service
  template:
    metadata:
      labels:
        app: embedding-service
        tier: ai
    spec:
      containers:
        - name: embedding-service
          image: ghcr.io/elyra/embedding-service:latest
          ports:
            - containerPort: 9001
          envFrom:
            - configMapRef:
                name: elyra-config
          requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet: { path: /health, port: 9001 }
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /health, port: 9001 }
            initialDelaySeconds: 60
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: embedding-service
  namespace: elyra
spec:
  selector:  { app: embedding-service }
  ports: [{ port: 9001, targetPort: 9001 }]
---
