# IMAGE SERVICE (port 9003)
# ───────────────────────���─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
  namespace: elyra
  labels:
    app: image-service
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
        tier: ai
    spec:
      containers:
        - name: image-service
          image: ghcr.io/elyra/image-service:latest
          ports:
            - containerPort: 9003
          envFrom:
            - configMapRef:
                name: elyra-config
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "1Gi" }
          livenessProbe:
            httpGet: { path: /health, port: 9003 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
  namespace: elyra
spec:
  selector:  { app: image-service }
  ports: [{ port: 9003, targetPort: 9003 }]
