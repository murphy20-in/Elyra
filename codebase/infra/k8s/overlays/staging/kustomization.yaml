apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: celery-worker

images:
  - name: ghcr.io/elyra/backend
    newTag: staging
  - name: ghcr.io/elyra/frontend
    newTag: staging

configMapGenerator:
  - name: elyra-config
    behavior: merge
    literals:
      - APP_ENV=staging
      - CORS_ORIGINS=https://staging.elyra.app
      - ALLOWED_HOSTS=staging.elyra.app

namespace: elyra-staging