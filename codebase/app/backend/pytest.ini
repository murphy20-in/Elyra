[pytest]
testpaths = tests
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: Pure unit tests (no DB, no network)
    api: API endpoint tests (requires test DB)
    websocket: WebSocket event tests
    integration: Multi-step flow tests (requires all test DBs)
    security: Security and auth tests
    slow: Tests that take > 5 seconds
    ai: AI service tests (mocked in CI)
log_cli = true
log_cli_level = WARNING
addopts = --tb=short -q
timeout = 30