version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elyra_db}
      POSTGRES_USER: ${POSTGRES_USER:-elyra_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elyra_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [elyra]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [elyra]

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-elyra_chat}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [elyra]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9099
    ports:
      - "9000:9000"
      - "9099:9099"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_access_key}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_secret_key}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks: [elyra]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio_access_key} ${S3_SECRET_KEY:-minio_secret_key};
      mc mb -p local/${S3_BUCKET:-elyra-media} || true;
      mc anonymous set download local/${S3_BUCKET:-elyra-media};
      exit 0;
      "
    networks: [elyra]

  embedding-service:
    build:
      context: ./ai-services/embedding-service
      dockerfile: Dockerfile
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:9001/health\", timeout=2).raise_for_status()'"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [elyra]

  moderation-service:
    build:
      context: ./ai-services/moderation-service
      dockerfile: Dockerfile
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:9002/health\", timeout=2).raise_for_status()'"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [elyra]

  image-service:
    build:
      context: ./ai-services/image-service
      dockerfile: Dockerfile
    ports:
      - "9003:9003"
    networks: [elyra]

  fake-profile-service:
    build:
      context: ./ai-services/fake-profile-service
      dockerfile: Dockerfile
    ports:
      - "9004:9004"
    networks: [elyra]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongodb
      EMBEDDING_SERVICE_URL: http://embedding-service:9001
      MODERATION_SERVICE_URL: http://moderation-service:9002
      IMAGE_SERVICE_URL: http://image-service:9003
      FAKE_PROFILE_SERVICE_URL: http://fake-profile-service:9004
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend:/app/app/backend
    networks: [elyra]

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.backend.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MONGO_HOST: mongodb
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [elyra]

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.backend.workers.celery_app:celery_app", "beat", "--loglevel=info"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
    networks: [elyra]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["npm", "run", "dev"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks: [elyra]

  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks: [elyra]

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles: ["observability"]
    networks: [elyra]

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/elyra.json:ro
    depends_on:
      - prometheus
    profiles: ["observability"]
    networks: [elyra]

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  elyra:
    driver: bridge
